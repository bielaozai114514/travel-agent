[pytest]
# 测试环境配置
env_files = .env.test

# 测试发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio 配置
asyncio_mode = auto


# 输出配置
addopts = -v --tb=short --color=yes

# 标记配置
markers =
    slow: 标记慢速测试
    integration: 集成测试
    unit: 单元测试
